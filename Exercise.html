<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise</title>
</head>
<body>
    <fieldset style="margin: 180px;"> 
        <legend>Registration page:</legend>
        <form action="#">
            <label for="employee name">Employee Name:</label>
            <input type="employee name" name="employee name" id="employee name">
            <p>
                <label for="job">Job:</label>
             <select name="job" id="job" multiple>
                <option value="Salesman">Salesman</option>
                <option value="Maneger">Maneger</option>
                <option value="Clerk">Clerk</option>
                <option value="Analyst">Analyst</option>

             </select>
            </p>
            <p>
                <label for="email">email:</label>
                <input type="email" name="email" id="email">
            </p>
             <p>
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" >
            </p>
            <p>
                <label for="re-password">re-Password:</label>
                <input type="re-password" name="re-password" id="re-password" placeholder="Confirm Your Password">
            </p>
            <p>
                <label for="gender">Gender:</label>
                <input type="radio" name="gender" id="male">
                <label for="male">Male</label>

                <input type="radio" name="gender" id="female">
                <label for="female">Female</label>
            </p>
            <p>
                <label for="birthday">Birthay:</label>
                <input type="date" name="birthday" id="birthday">
            </p>
            <p>
                <label for="salary">Salary:</label>
                <input type="salary" name="salary" id="salary">
            </p>
            <p>
                <label for="commission">Commission:</label>
                <input type="commission" name="commission" id="commission">
            </p>
             <p>
                <label for="total salary">Total Salary:</label>
                <input type="total salary" name="total salary" id="total salary">
            </p>
            <p>
                <button>Submit</button>
                <button type="reset">Reset</button>
            </p>        
        </form>
    </fieldset>
    
</body>
</html>
